name: Build QR Go Native APK

on:
  push:
    branches: [qr-go-build]
  workflow_dispatch:

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: qr-go-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK with Android SDK
        run: |
          set -euxo pipefail
          PLATFORM=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "Platform: $PLATFORM"
          echo "Build tools: $BT"
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 -classpath "$PLATFORM/android.jar" -d build/classes src/com/qrgo/app/MainActivity.java
          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --lib "$PLATFORM/android.jar" --output build/dex build/classes.jar
          "$BT/aapt2" link -I "$PLATFORM/android.jar" --manifest AndroidManifest.xml -o build/app-unsigned.apk
          cd build/dex && zip -q -j ../app-unsigned.apk classes.dex && cd ../..
          "$BT/zipalign" -f 4 build/app-unsigned.apk build/app-aligned.apk
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=QR Go,C=BR" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android --out build/QR-Go.apk build/app-aligned.apk
          "$BT/apksigner" verify --verbose build/QR-Go.apk
          ls -lh build/QR-Go.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Go-Native-APK
          path: qr-go-native/build/QR-Go.apk
          retention-days: 7
